name: Trunkrs report check

on:
  schedule:
    # Cloud-only: no laptop or open Pitboard browser is required.
    # Tuesday–Saturday only. These UTC hours fall on the same Dutch calendar day.
    # The client also checks the actual Dutch day after delayed starts and skips before 06:00 NL.
    # Retry through the morning and catch up later if GitHub delays/drops starts.
    # This mitigates delays; GitHub cron is not an on-time delivery guarantee.
    - cron: '17,27,37,47,57 4-9 * * 2-6'
    - cron: '17 10-20 * * 2-6'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: trunkrs-report-check
  cancel-in-progress: false

jobs:
  request-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Start check and verify completed mailbox scan and daily report
        run: python3 scripts/trunkrs-cloud-check.py
